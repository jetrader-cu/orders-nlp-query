[project]
name = "orders-nlp-query"
version = "0.1.0"
description = "Pipeline ETL de pedidos y API FastAPI con interfaz Text-to-SQL segura usando SQLite/DuckDB y LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlglot>=25.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
duckdb = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
]
llm = [
    "google-genai>=1.0.0",
    "openai>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
